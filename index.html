<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PuntoZero — Tu opinión nos importa</title>
<meta name="description" content="Ayúdanos a afinar el rumbo de PuntoZero. Tu opinión como cliente da forma a cada proyecto que hacemos." />
<style>

  @font-face {
    font-family: 'Archivo';
    src: url('assets/fonts/archivo-variable.woff2') format('woff2');
    font-weight: 400 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'Big Shoulders Display';
    src: url('assets/fonts/bigshoulders-variable.woff2') format('woff2');
    font-weight: 600 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('assets/fonts/plexmono-500.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;
  }

  :root {
    --bg: #08080b;
    --panel: #101015;
    --ink: #f3f2ef;
    --ink-dim: #9b9aa3;
    --ink-faint: #5c5b64;
    --silver: #cdd1da;
    --silver-bright: #f1f2f6;
    --line: rgba(205, 209, 218, 0.16);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 6vh 6vw;
    overflow-x: hidden;
    position: relative;
  }

  /* logo watermark, oversized and dimmed, as the page's backdrop */
  .bg-mark {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 92vmax;
    height: 92vmax;
    max-width: none;
    transform: translate(-50%, -50%);
    object-fit: contain;
    opacity: 0.05;
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 0;
  }

  /* blueprint corner ticks */
  .tick { position: fixed; width: 22px; height: 22px; border: 1px solid var(--line); pointer-events: none; z-index: 1; }
  .tick--tl { top: 28px; left: 28px; border-right: none; border-bottom: none; }
  .tick--tr { top: 28px; right: 28px; border-left: none; border-bottom: none; }
  .tick--bl { bottom: 28px; left: 28px; border-right: none; border-top: none; }
  .tick--br { bottom: 28px; right: 28px; border-left: none; border-top: none; }

  .panel {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 30rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1.75rem;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .eyebrow::before {
    content: '';
    display: block;
    width: 2.25rem;
    height: 1px;
    background: var(--line);
  }

  h1 {
    margin: 0;
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    line-height: 0.97;
    letter-spacing: 0.005em;
    text-wrap: balance;
    color: var(--silver-bright);
  }

  p.lede {
    margin: 0;
    max-width: 34ch;
    font-size: 1.05rem;
    line-height: 1.65;
    color: var(--ink-dim);
  }

  .cta {
    margin-top: 0.5rem;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.95rem 1.6rem;
    background: linear-gradient(180deg, #2a2a30, #17171b);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--silver-bright);
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 0.98rem;
    text-decoration: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 1px 0 rgba(0,0,0,0.4);
    transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }

  .cta:hover {
    border-color: var(--silver);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 18px rgba(0,0,0,0.5);
    transform: translateY(-1px);
  }

  .cta:focus-visible {
    outline: 2px solid var(--silver);
    outline-offset: 3px;
  }

  .cta__arrow {
    transition: transform 0.2s ease;
  }

  .cta:hover .cta__arrow {
    transform: translateX(3px);
  }

  .meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
  }

  footer {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: center;
  }

  @media (max-width: 30rem) {
    .tick { display: none; }
    footer { position: static; margin-top: 3rem; transform: none; }
    body { display: block; padding: 10vh 7vw 4vh; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .panel { animation: rise 0.6s ease both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <img class="bg-mark" src="assets/logo.jpg" alt="" aria-hidden="true" />

  <span class="tick tick--tl"></span>
  <span class="tick tick--tr"></span>
  <span class="tick tick--bl"></span>
  <span class="tick tick--br"></span>

  <main class="panel">
    <p class="eyebrow">Recalibrando el rumbo</p>

    <h1>Ayúdanos a afinar<br>cada proyecto</h1>

    <p class="lede">
      Tu experiencia como cliente es la referencia que usamos para ajustar cómo trabajamos.
      El cuestionario lleva menos de 3 minutos.
    </p>

    <a class="cta" href="https://docs.google.com/forms/d/e/1FAIpQLSdfWdgkTxSadHJym34rUiHQMyjp1haLxqlPs4SgGm8m6zmWxQ/viewform?usp=header" target="_blank" rel="noopener">
      Tu opinión nos importa
      <span class="cta__arrow" aria-hidden="true">→</span>
    </a>

    <p class="meta">3 MIN · ANÓNIMO OPCIONAL</p>
  </main>

  <footer>PuntoZero</footer>

</body>
</html>
